<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cancho-afm live console</title>
    <style>

            display: flex;
            flex-direction: column;
            gap: 0.5rem;

        :root { color-scheme: light dark; --cui-chart: #0550ae; }

            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem; max-width: 46rem;
        }
        [role="status"] {
            font-size: 1rem;
            font-weight: 600;

        }
